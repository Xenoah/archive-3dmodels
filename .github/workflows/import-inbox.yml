name: Import Inbox

on:
  workflow_dispatch:
    inputs:
      merge:
        description: "Allow merging into existing model folders"
        required: false
        default: "false"
  push:
    branches: ["main"]
    paths:
      - "_inbox/**"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run inbox import
        run: |
          if [ "${{ github.event.inputs.merge }}" = "true" ]; then
            npm run import:all-inbox -- --merge
          else
            npm run import:all-inbox
          fi

      - name: Apply inbox import
        run: |
          if [ "${{ github.event.inputs.merge }}" = "true" ]; then
            npm run import:all-inbox -- --merge --apply
          else
            npm run import:all-inbox -- --apply
          fi

      - name: Validate imported draft models
        run: npm run validate

      - name: Commit imported models
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No import changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "import inbox models"
          git push
