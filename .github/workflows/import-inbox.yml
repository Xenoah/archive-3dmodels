name: Import Inbox

on:
  workflow_dispatch:
    inputs:
      merge:
        description: "Allow merging into existing model folders"
        required: false
        default: "false"
  push:
    branches: ["main"]
    paths:
      - "_inbox/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run inbox import
        run: |
          if [ "${{ github.event.inputs.merge }}" = "true" ]; then
            npm run import:all-inbox -- --merge
          else
            npm run import:all-inbox
          fi

      - name: Apply inbox import
        run: |
          if [ "${{ github.event.inputs.merge }}" = "true" ]; then
            npm run import:all-inbox -- --merge --apply
          else
            npm run import:all-inbox -- --apply
          fi

      - name: Validate imported draft models
        run: npm run validate

      - name: Create import pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: inbox/import-${{ github.run_id }}
          delete-branch: true
          commit-message: "import inbox models"
          title: "Import inbox models"
          body: |
            This PR was generated from `_inbox/{slug}` folders.

            Imported models stay as `status: "draft"` by default.
            Review the generated Markdown, metadata, source files, and warnings before changing a model to public.
